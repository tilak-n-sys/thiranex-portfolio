<body>

  <header>

  <main id="main-content">
    <section aria-labelledby="contact-heading">
      <h1 id="contact-heading">Contact Me</h1>
      <p>If you would like to get in touch, please complete the form below.</p>

      <form action="#" method="post" aria-label="Contact form">
        <div>
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required aria-required="true">
        </div>

        <div>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" autocomplete="email" required aria-required="true">
        </div>

        <div>
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" required aria-required="true">
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required aria-required="true"></textarea>
        </div>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
