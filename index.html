<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NovaCart - responsive full-stack e-commerce capstone project">
  <title>NovaCart | Modern Shopping</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <a class="logo" href="#/">Nova<span>Cart</span></a>
  <nav id="nav"><a href="#/">Home</a><a href="#/products">Products</a><a href="#/about">About</a></nav>
  <div class="actions">
    <button id="searchToggle" aria-label="Search">⌕</button>
    <a class="cart" href="#/cart">Cart <b id="cartCount">0</b></a>
    <button id="menu" aria-label="Menu">☰</button>
  </div>
</header>

<div id="searchBar" class="search hide">
  <input id="globalSearch" type="search" placeholder="Search products..." aria-label="Search products">
</div>

<main id="app" aria-live="polite"></main>

<footer>
  <b>NovaCart</b>
  <span>Modern products. Simple shopping.</span>
  <span>© <span id="year"></span> NovaCart</span>
</footer>

<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
